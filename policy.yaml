rules:
  - tool: lookup_charge
    action: allow
  - tool: lookup_payment_intent
    action: allow
  - tool: list_recent_charges
    action: allow
  - tool: list_refunds_for_charge
    action: allow
  - tool: create_refund
    when:
      dry_run: true
    action: allow
  - tool: create_refund
    action: approvalRequired
  - tool: send_slack_message
    action: redact
    redactFields:
      - message
budgets:
  maxToolCallsPerTurn: 5
defaultAction: deny
