services:
  gateway:
    image: debian:bookworm-slim
    working_dir: /workspace
    command: ["/workspace/.compose-bin/gateway"]
    depends_on:
      fake-upstream:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GATEWAY_PORT: "8080"
      POLICY_FILE: policy.yaml
      POSTGRES_DSN: postgres://gateway:gateway@postgres:5432/gateway?sslmode=disable
      REDIS_DSN: redis://redis:6379/0
      SLACK_BOT_TOKEN: "xoxb-demo-token"
      SLACK_SIGNING_SECRET: "demo-signing-secret"
      SLACK_CHANNEL: "C-DEMO-APPROVALS"
      SESSION_LOCK_TTL: "3s"
      LOCK_ACQUIRE_TIMEOUT: "5s"
      UPSTREAM_MCP_URL: http://fake-upstream:8081/mcp
    ports:
      - "18080:8080"
    volumes:
      - .:/workspace

  fake-upstream:
    image: python:3.12-alpine
    working_dir: /workspace
    command: ["python", "/workspace/scripts/fake_upstream.py"]
    ports:
      - "18081:8081"
    volumes:
      - .:/workspace

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "6379"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  localstripe:
    build:
      context: ./localstripe_demo
      dockerfile_inline: |
        FROM python:3.12-alpine
        WORKDIR /app
        COPY . .
        RUN pip install --no-cache-dir -e .
        ENTRYPOINT ["localstripe"]
    ports:
      - "18420:8420"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header='Authorization: Bearer sk_test_12345' http://127.0.0.1:8420/v1/charges"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  localstripe-mcp:
    build:
      context: ./localstripe_demo
      dockerfile_inline: |
        FROM python:3.12-alpine
        WORKDIR /app
        COPY . .
        RUN pip install --no-cache-dir -e ".[mcp]"
        ENTRYPOINT ["localstripe-mcp"]
    depends_on:
      localstripe:
        condition: service_healthy
    environment:
      LOCALSTRIPE_URL: http://localstripe:8420
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8421"
      MCP_TRANSPORT: streamable-http
    ports:
      - "18421:8421"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null --header='Content-Type: application/json' --header='Accept: application/json, text/event-stream' --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-03-26\",\"capabilities\":{},\"clientInfo\":{\"name\":\"healthcheck\",\"version\":\"1.0.0\"}}}' http://127.0.0.1:8421/mcp",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  demo-webapp:
    build:
      context: ./localstripe_demo
      dockerfile_inline: |
        FROM python:3.12-alpine
        WORKDIR /app
        COPY . .
        RUN pip install --no-cache-dir -e ".[webapp]"
        ENTRYPOINT ["demo-webapp"]
    depends_on:
      localstripe-mcp:
        condition: service_healthy
      localstripe:
        condition: service_healthy
    environment:
      MCP_URL: http://localstripe-mcp:8421/mcp
      LOCALSTRIPE_URL: http://localstripe:8420
      LOCALSTRIPE_API_KEY: sk_test_12345
      WEBAPP_HOST: "0.0.0.0"
      WEBAPP_PORT: "8422"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    ports:
      - "18422:8422"

volumes:
  postgres-data:
