name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.22"
  PYTHON_VERSION: "3.11"

jobs:
  # ── Gateway (Go) ─────────────────────────────────────────────────────────────
  gateway:
    name: Gateway · Go ${{ env.GO_VERSION }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: gateway/coverage.out

  # ── Agent SDK (Python) ───────────────────────────────────────────────────────
  agent:
    name: Agent · Python ${{ env.PYTHON_VERSION }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Test
        run: pytest --tb=short -q

  # ── Docker build (gated on both jobs) ────────────────────────────────────────
  docker:
    name: Docker · build & push
    needs: [gateway, agent]
    runs-on: ubuntu-latest
    # Only push images from main; PRs only build to validate the Dockerfile.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/gateway:latest
            ghcr.io/${{ github.repository }}/gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
