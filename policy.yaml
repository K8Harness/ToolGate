rules:
  - tool: refund_small
    action: allow
  - tool: refund_large
    action: approvalRequired
  - tool: delete_record
    action: deny
  - tool: send_slack_message
    action: redact
    redactFields:
      - message
  - tool: lookup_charge
    action: allow
  - tool: lookup_payment_intent
    action: allow
  - tool: list_recent_charges
    action: allow
  - tool: list_refunds_for_charge
    action: allow
  - tool: create_refund
    action: approvalRequired
budgets:
  maxToolCallsPerTurn: 5
defaultAction: deny
