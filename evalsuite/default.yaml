cases:
  - name: lookup-allow
    input: lookup-charge
    mustInclude:
      - list_recent_charges
    policyOutcome: allow

  - name: create-refund-approval
    input: create-refund
    mustInclude:
      - create_refund
    policyOutcome: approvalRequired

  - name: deny-test
    input: deny-test
    mustInclude:
      - delete_customer
    policyOutcome: deny

  - name: pii-redact
    input: pii-message
    mustInclude:
      - send_lark_message
    policyOutcome: allow
    mustNotContainInArgs:
      - "123-45-6789"
