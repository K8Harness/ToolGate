name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-spec-review:
    name: Claude · spec drift review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Keep API-key-backed review on same-repository PRs by default.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Fetch PR base and head refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "$PR_BASE_REF" "+refs/pull/$PR_NUMBER/head"

      - name: Load base-branch Claude prompt
        id: review_prompt
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROMPT_PATH: .github/review-prompts/claude-spec-review.md
        run: |
          {
            echo "text<<__CLAUDE_PROMPT__"
            if git cat-file -e "$PR_BASE_SHA:$PROMPT_PATH"; then
              git show "$PR_BASE_SHA:$PROMPT_PATH"
            else
              cat "$PROMPT_PATH"
            fi
            echo "__CLAUDE_PROMPT__"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude spec drift review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            This is PR #${{ github.event.pull_request.number }} for ${{ github.repository }}.

            Pull request title:
            ${{ github.event.pull_request.title }}

            Pull request body:
            ${{ github.event.pull_request.body }}

            Review only the changes introduced by this PR:
            - Base SHA: ${{ github.event.pull_request.base.sha }}
            - Head SHA: ${{ github.event.pull_request.head.sha }}
            - Base ref: ${{ github.event.pull_request.base.ref }}
            - Head ref: ${{ github.event.pull_request.head.ref }}

            Follow these review instructions exactly:

            ${{ steps.review_prompt.outputs.text }}

            Use git diff, `.kiro/specs/`, and `.kiro/steering/` as needed.
            Post the review as a PR comment.
          claude_args: "--max-turns 6"

  request-codex-code-review:
    name: Codex · request cloud review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Fetch PR base and head refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "$PR_BASE_REF" "+refs/pull/$PR_NUMBER/head"

      - name: Load base-branch Codex prompt
        id: review_prompt
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROMPT_PATH: .github/review-prompts/codex-code-review.md
        run: |
          {
            echo "text<<__CODEX_PROMPT__"
            if git cat-file -e "$PR_BASE_SHA:$PROMPT_PATH"; then
              git show "$PR_BASE_SHA:$PROMPT_PATH"
            else
              cat "$PROMPT_PATH"
            fi
            echo "__CODEX_PROMPT__"
          } >> "$GITHUB_OUTPUT"

      - name: Comment Codex review request on PR
        uses: actions/github-script@v7
        env:
          REVIEW_PROMPT: ${{ steps.review_prompt.outputs.text }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = `<!-- codex-cloud-review-request:${process.env.PR_HEAD_SHA} -->`;
            const body = [
              marker,
              "@codex review",
              "",
              "Use the following focus. Review only implementation risks in this PR. Claude handles spec drift separately.",
              "",
              "Pull request title:",
              process.env.PR_TITLE || "",
              "",
              "Pull request body:",
              process.env.PR_BODY || "",
              "",
              "Review only the changes introduced by this PR:",
              `- Base SHA: ${process.env.PR_BASE_SHA}`,
              `- Head SHA: ${process.env.PR_HEAD_SHA}`,
              `- Base ref: ${process.env.PR_BASE_REF}`,
              `- Head ref: ${process.env.PR_HEAD_REF}`,
              "",
              "Follow these review instructions:",
              "",
              process.env.REVIEW_PROMPT || "",
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            if (comments.some((comment) => comment.body && comment.body.includes(marker))) {
              core.info("Codex review request already exists for this head SHA.");
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
