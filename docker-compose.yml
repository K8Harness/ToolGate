services:
  gateway:
    image: debian:bookworm-slim
    working_dir: /workspace
    command: ["/workspace/.compose-bin/gateway"]
    depends_on:
      fake-upstream:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GATEWAY_PORT: "8080"
      POLICY_FILE: policy.yaml
      POSTGRES_DSN: postgres://gateway:gateway@postgres:5432/gateway?sslmode=disable
      REDIS_DSN: redis://redis:6379/0
      SLACK_BOT_TOKEN: "xoxb-demo-token"
      SLACK_SIGNING_SECRET: "demo-signing-secret"
      SLACK_CHANNEL: "C-DEMO-APPROVALS"
      SESSION_LOCK_TTL: "3s"
      LOCK_ACQUIRE_TIMEOUT: "5s"
      UPSTREAM_MCP_URL: http://fake-upstream:8081/mcp
    ports:
      - "18080:8080"
    volumes:
      - .:/workspace

  fake-upstream:
    image: python:3.12-alpine
    working_dir: /workspace
    command: ["python", "/workspace/scripts/fake_upstream.py"]
    ports:
      - "18081:8081"
    volumes:
      - .:/workspace

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "6379"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
