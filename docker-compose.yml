services:
  gateway:
    image: debian:bookworm-slim
    working_dir: /workspace
    command: ["sh", "-c", "apt-get update -qq && apt-get install -y -qq ca-certificates > /dev/null 2>&1 && /workspace/.compose-bin/gateway"]
    depends_on:
      fake-upstream:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-lark:
        condition: service_started
    environment:
      GATEWAY_PORT: "8080"
      POLICY_FILE: policy.yaml
      POSTGRES_DSN: postgres://gateway:gateway@postgres:5432/gateway?sslmode=disable
      REDIS_DSN: redis://redis:6379/0
      LARK_APP_ID: ${LARK_APP_ID:-cli_demo_app_id}
      LARK_APP_SECRET: ${LARK_APP_SECRET:-demo_app_secret}
      LARK_CHAT_ID: ${LARK_CHAT_ID:-oc_demo_approvals}
      LARK_VERIFICATION_TOKEN: ${LARK_VERIFICATION_TOKEN:-demo-verification-token}
      LARK_API_BASE_URL: ${LARK_API_BASE_URL}
      SESSION_LOCK_TTL: "3s"
      LOCK_ACQUIRE_TIMEOUT: "5s"
      APPROVAL_TIMEOUT: "180s"
      UPSTREAM_MCP_URL: http://fake-upstream:8081/mcp
    ports:
      - "18080:8080"
    volumes:
      - .:/workspace

  mock-lark:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.25-alpine
        WORKDIR /app
        COPY . .
        RUN go build -o mock-lark ./examples/mock-lark
        ENTRYPOINT ["./mock-lark"]
    environment:
      GATEWAY_URL: http://gateway:8080
      LARK_VERIFICATION_TOKEN: "demo-verification-token"
    ports:
      - "18090:8090"

  fake-upstream:
    image: python:3.12-alpine
    working_dir: /workspace
    command: ["python", "/workspace/scripts/fake_upstream.py"]
    ports:
      - "18081:8081"
    volumes:
      - .:/workspace

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "6379"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    ports:
      - "16379:6379"

  localstripe:
    build:
      context: ./localstripe_demo
      dockerfile_inline: |
        FROM python:3.12-alpine
        WORKDIR /app
        COPY . .
        RUN pip install --no-cache-dir -e .
        ENTRYPOINT ["localstripe"]
    ports:
      - "18420:8420"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header='Authorization: Bearer sk_test_12345' http://127.0.0.1:8420/v1/charges"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  localstripe-mcp:
    build:
      context: ./localstripe_demo
      dockerfile_inline: |
        FROM python:3.12-alpine
        WORKDIR /app
        COPY . .
        RUN pip install --no-cache-dir -e ".[mcp]"
        ENTRYPOINT ["localstripe-mcp"]
    depends_on:
      localstripe:
        condition: service_healthy
    environment:
      LOCALSTRIPE_URL: http://localstripe:8420
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8421"
      MCP_TRANSPORT: streamable-http
    ports:
      - "18421:8421"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null --header='Content-Type: application/json' --header='Accept: application/json, text/event-stream' --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-03-26\",\"capabilities\":{},\"clientInfo\":{\"name\":\"healthcheck\",\"version\":\"1.0.0\"}}}' http://127.0.0.1:8421/mcp",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  eval-trigger:
    build:
      context: ./localstripe_demo
      dockerfile_inline: |
        FROM python:3.12-alpine
        WORKDIR /app
        COPY . .
        RUN pip install --no-cache-dir -e ".[agent]"
        ENTRYPOINT ["localstripe-eval-trigger"]
    depends_on:
      localstripe-mcp:
        condition: service_healthy
    environment:
      MCP_URL: http://localstripe-mcp:8421/mcp
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    ports:
      - "18086:8086"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8086"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s

  demo-webapp:
    build:
      context: ./localstripe_demo
      dockerfile_inline: |
        FROM python:3.12-alpine
        WORKDIR /app
        COPY . .
        RUN pip install --no-cache-dir -e ".[webapp]"
        ENTRYPOINT ["demo-webapp"]
    depends_on:
      localstripe-mcp:
        condition: service_healthy
      localstripe:
        condition: service_healthy
    environment:
      MCP_URL: http://localstripe-mcp:8421/mcp
      LOCALSTRIPE_URL: http://localstripe:8420
      LOCALSTRIPE_API_KEY: sk_test_12345
      WEBAPP_HOST: "0.0.0.0"
      WEBAPP_PORT: "8422"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    ports:
      - "18422:8422"

volumes:
  postgres-data:
